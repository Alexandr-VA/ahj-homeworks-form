<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popover Widget</title>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>Popover Widget</h1>
      <p>Нажмите на кнопку, чтобы показать popover</p>
      <div class="button-wrapper">
        <button 
          id="popoverButton" 
          class="btn btn-primary" 
          data-title="Popover title"
          data-content="And here's some amazing content. It's very engaging. Right?"
        >
          Toggle popover
        </button>
      </div>
    </div>
  </div>
</body>
</html>
